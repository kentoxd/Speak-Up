<ion-tabs>

  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home" [class.active]="activeTab === 'home'">
      <ion-icon aria-hidden="true" name="home"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="lessons" [class.active]="activeTab === 'lessons'">
      <ion-icon aria-hidden="true" name="school"></ion-icon>
      <ion-label>Learn</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="practice" [class.active]="activeTab === 'practice'">
      <ion-icon aria-hidden="true" name="mic"></ion-icon>
      <ion-label>Practice</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profile" [class.active]="activeTab === 'profile'">
      <ion-icon aria-hidden="true" name="person"></ion-icon>
      <ion-label>Profile</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

</ion-tabs>
