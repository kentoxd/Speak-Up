<body>
  <app-root></app-root>
  
  <!-- Service Worker Registration with Microphone Support Check -->
  <script>
    // Check for critical APIs before loading app
    (function() {
      const hasGetUserMedia = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
      const hasSpeechRecognition = ('SpeechRecognition' in window) || ('webkitSpeechRecognition' in window);
      const hasMediaRecorder = typeof MediaRecorder !== 'undefined';
      
      console.log('Browser Capabilities Check:', {
        getUserMedia: hasGetUserMedia,
        speechRecognition: hasSpeechRecognition,
        mediaRecorder: hasMediaRecorder,
        isSecureContext: window.isSecureContext,
        protocol: window.location.protocol
      });
      
      // Warn if not HTTPS
      if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
        console.warn('⚠️ App must be served over HTTPS for microphone access to work!');
      }
      
      // Store capabilities globally for app to access
      window.browserCapabilities = {
        hasGetUserMedia,
        hasSpeechRecognition,
        hasMediaRecorder,
        isSecureContext: window.isSecureContext
      };
    })();
    
    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('✓ Service Worker registered:', registration.scope);
          })
          .catch(error => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }
  </script>
